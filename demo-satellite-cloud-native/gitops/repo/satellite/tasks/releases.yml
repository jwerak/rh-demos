---
# Promote content view versions so each environment serves what releases.yml says.
# Idempotent: an environment that already has the declared version is left alone.
#
# Git acts only on environments whose declaration CHANGED since the last run
# (remembered in ConfigMap satellite-cac-applied). A promotion made in the
# Satellite UI is therefore not silently reverted by an unrelated sync (say a
# structure.yml PR): it is reported as DRIFT until `release.sh record` (or
# `release.sh promote`) writes it into Git. drift: enforce in releases.yml
# switches to strict GitOps (Satellite always forced back to Git).
- name: Releases
  block:
    - name: Declared versions are quoted "major.minor" strings
      ansible.builtin.assert:
        that:
          - environments[item] is defined
          - environments[item] is string
          - environments[item] is match('^[0-9]+[.][0-9]+$')
        fail_msg: >-
          {{ item }}: the version must be a quoted "major.minor" string such as "3.0" or "3.1"
          (got {{ environments[item] | default('nothing') }}). Unquoted, YAML reads 3.10 as the number 3.1.
        quiet: true
      loop: [Dev, QA, Prod]

    - name: Read content view versions
      redhat.satellite.content_view_version_info:
        organization: "{{ satellite_organization }}"
        content_view: "{{ content_view }}"
      register: cv_versions_before

    - name: List available versions
      ansible.builtin.set_fact:
        cv_available: "{{ cv_versions_before.content_view_versions | map(attribute='version') | map('string') | list }}"
        cv_env_before: {}

    - name: Map environment -> version (before)
      ansible.builtin.set_fact:
        cv_env_before: "{{ cv_env_before | combine({item.1.name: item.0.version | string}) }}"
      loop: "{{ cv_versions_before.content_view_versions | subelements('environments', skip_missing=True) }}"
      loop_control:
        label: "{{ item.1.name }}={{ item.0.version }}"

    - name: Declared versions exist (no accidental publish)
      ansible.builtin.assert:
        that: (item.value | string) in cv_available
        fail_msg: >-
          {{ item.key }} wants {{ content_view }} version {{ item.value }}, which does not exist.
          Available: {{ cv_available | join(', ') }}. Publish first (gitops/scripts/publish-version.sh).
        quiet: true
      loop: "{{ environments | dict2items }}"
      loop_control:
        label: "{{ item.key }}={{ item.value }}"

    - name: Pipeline order (Prod <= QA <= Dev)
      ansible.builtin.assert:
        that:
          - (environments.QA | string) is version(environments.Dev | string, '<=')
          - (environments.Prod | string) is version(environments.QA | string, '<=')
        fail_msg: >-
          Pipeline order violated: Dev={{ environments.Dev }} QA={{ environments.QA }} Prod={{ environments.Prod }}.
          A version reaches Prod only after QA has it. For an emergency set
          allow_out_of_order: true in releases.yml and say why in the PR.
        quiet: true
      when: not (allow_out_of_order | default(false) | bool)

    - name: Read last applied declaration
      kubernetes.core.k8s_info:
        kind: ConfigMap
        name: "{{ releases_applied_cm }}"
        namespace: "{{ registration_namespace }}"
      register: applied_cm

    - name: Last applied declaration
      ansible.builtin.set_fact:
        releases_applied: "{{ (applied_cm.resources | first).data | default({}) if applied_cm.resources else {} }}"
        release_plan: {}

    - name: Plan per environment (in-sync / promote / drift)
      ansible.builtin.set_fact:
        release_plan: "{{ release_plan | combine({item: plan}) }}"
      vars:
        declared: "{{ environments[item] }}"
        current: "{{ cv_env_before[item] | default('') }}"
        git_changed: "{{ releases_applied[item] | default('') != declared }}"
        plan: >-
          {{ 'in-sync' if current == declared
             else 'promote' if (git_changed | bool) or (drift | default('report')) == 'enforce'
             else 'drift' }}
      loop: [Dev, QA, Prod]

    - name: Promote (Dev, then QA, then Prod)
      redhat.satellite.content_view_version:
        organization: "{{ satellite_organization }}"
        content_view: "{{ content_view }}"
        version: "{{ environments[item] | string }}"
        lifecycle_environments:
          - "{{ item }}"
        # Katello only lets a version into an environment its predecessor
        # already holds. Rollback (older version into Prod) and the emergency
        # path need force; the order rule above is the real gate.
        force_promote: true
      loop: [Dev, QA, Prod]
      when: release_plan[item] == 'promote'

    - name: Summary
      ansible.builtin.debug:
        msg: >-
          {% if release_plan[item] == 'promote' %}{{ item }}: {{ cv_env_before[item] | default('-') }} -> {{ environments[item] }} (promoted)
          {% elif release_plan[item] == 'drift' %}DRIFT {{ item }}: Satellite serves {{ cv_env_before[item] | default('-') }},
          Git declares {{ environments[item] }} and has not changed since the last run, so the change made
          outside Git is left alone. Record it: gitops/scripts/release.sh record
          {% else %}{{ item }}: {{ environments[item] }} (unchanged){% endif %}
      loop: [Dev, QA, Prod]

    - name: Remember the applied declaration
      kubernetes.core.k8s:
        state: present
        apply: true
        force: true
        definition: "{{ releases_applied_obj }}"

  rescue:
    - name: Record failure
      ansible.builtin.set_fact:
        cac_failures: "{{ cac_failures + ['releases: ' ~ (ansible_failed_result.msg | default('failed'))] }}"
