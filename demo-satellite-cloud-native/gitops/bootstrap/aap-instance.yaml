---
# AAP for the GitOps layer: platform gateway, automation controller and
# Event-Driven Ansible (Gitea push -> event stream -> "SAT · Apply Satellite as
# code"). Hub is off to save cluster capacity next to the Satellite VM.
# The operator generates the admin password in Secret "aap-admin-password".
apiVersion: aap.ansible.com/v1alpha1
kind: AnsibleAutomationPlatform
metadata:
  name: aap
  namespace: aap
spec:
  image_pull_policy: IfNotPresent
  database:
    resource_requirements:
      requests:
        cpu: 200m
        memory: 512Mi
    storage_requirements:
      requests:
        storage: 20Gi
  controller:
    disabled: false
  hub:
    disabled: true
  eda:
    disabled: false
