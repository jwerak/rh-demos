---
# Generate one registration command per fleet environment (activation key +
# host group) and store them in Secret satellite-registration. Fleet VMs mount
# that Secret as disk "satreg" and run the command for their environment.
#
# The commands contain a registration JWT: no_log keeps them out of the Argo
# CD job log.
- name: Registration commands
  block:
    - name: Generate registration commands
      redhat.satellite.registration_command:
        organization: "{{ satellite_organization }}"
        location: "{{ satellite_location }}"
        hostgroup: "{{ item.hostgroup }}"
        activation_keys:
          - "{{ item.activation_key }}"
        insecure: true
        force: true
        setup_insights: false
        setup_remote_execution_pull: true
        jwt_expiration: 0
      loop: "{{ registration_targets }}"
      loop_control:
        label: "{{ item.env }}: {{ item.activation_key }} + {{ item.hostgroup }}"
      register: reg_cmds
      no_log: true

    - name: Encode commands
      ansible.builtin.set_fact:
        registration_data: "{{ registration_data | default({}) | combine({item.item.env: item.registration_command | b64encode}) }}"
      loop: "{{ reg_cmds.results }}"
      loop_control:
        label: "{{ item.item.env }}"
      no_log: true

    # data (base64), not stringData: server-side apply handles it cleanly.
    - name: Build the Secret
      ansible.builtin.set_fact:
        registration_secret:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ registration_secret_name }}"
            namespace: "{{ registration_namespace }}"
            labels:
              app.kubernetes.io/part-of: satellite-cloud-native
              app.kubernetes.io/managed-by: satellite-as-code
              demo: satellite-cloud-native
          type: Opaque
          data: "{{ registration_data }}"
      no_log: true

    # kubernetes.core picks the credentials up from the environment: the AAP
    # "OpenShift API Bearer Token" credential (K8S_AUTH_HOST/K8S_AUTH_API_KEY),
    # KUBECONFIG on a laptop (run-local.sh), or the pod's service account in
    # the Argo CD fallback Job.
    - name: Apply Secret
      kubernetes.core.k8s:
        state: present
        apply: true
        force: true
        definition: "{{ registration_secret }}"
      no_log: true

    - name: Registration commands stored
      ansible.builtin.debug:
        msg: >-
          Secret {{ registration_namespace }}/{{ registration_secret_name }} holds commands for
          {{ registration_targets | map(attribute='env') | join(', ') }}
          (host groups {{ registration_targets | map(attribute='hostgroup') | join(', ') }})

  rescue:
    - name: Record failure
      ansible.builtin.set_fact:
        cac_failures: "{{ cac_failures + ['registration: ' ~ (ansible_failed_result.msg | default('failed (output hidden by no_log)'))] }}"
