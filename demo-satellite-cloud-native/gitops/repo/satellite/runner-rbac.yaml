---
# Service account for the Satellite-as-code Job. It writes the registration
# Secret and the ConfigMap satellite-cac-applied (last applied releases.yml)
# in this namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: satellite-cac
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: satellite-cac
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: satellite-cac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: satellite-cac
subjects:
  - kind: ServiceAccount
    name: satellite-cac
