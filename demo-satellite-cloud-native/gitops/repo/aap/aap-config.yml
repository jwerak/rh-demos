---
# AAP 2.5+ configuration as code for the GitOps layer.
# Format: infra.aap_configuration (dispatch role). Applied by configure-aap.yml
# (gitops/scripts/bootstrap.sh aapconfig).
#
# Job templates are grouped by prefix (gitops/README.md, "Run sheet"):
#   GitOps ·  opens a pull request in Gitea (desired state)
#   SAT ·     acts on Satellite
#   HOST ·    acts on hosts through Satellite remote execution
#   VM ·      acts on OpenShift directly, outside Git
#   DEMO ·    demo housekeeping
#
# These variables come from extra vars at apply time, never from Git:
#   gitea_url           Gitea URL as seen from AAP job pods (internal service)
#   gitea_token         Gitea API token (~/.cache/satellite-demo/gitea-token)
#   gitea_repo_url      Gitea repository URL for the project
#   satellite_url       https://<SAT_FQDN>
#   satellite_password  Satellite admin password
#   k8s_host            Kubernetes API URL as seen from job pods
#   k8s_token           token of ServiceAccount satellite-cloud-native/aap-demo
#   gitops_ee_image     the runner image (ImageStream satellite-cac-runner)

aap_organizations:
  - name: SOE Demo
    description: Self-service RHEL servers through GitOps

controller_credential_types:
  - name: Gitea API
    description: Injects GITEA_URL and GITEA_TOKEN for API-driven pull requests
    kind: cloud
    inputs:
      fields:
        - id: url
          type: string
          label: Gitea URL
        - id: token
          type: string
          label: API token
          secret: true
      required: [url, token]
    injectors:
      env:
        GITEA_URL: "{% raw %}{{ url }}{% endraw %}"
        GITEA_TOKEN: "{% raw %}{{ token }}{% endraw %}"

  - name: Satellite API
    description: Injects FOREMAN_* for redhat.satellite modules (and the Satellite-as-code playbook)
    kind: cloud
    inputs:
      fields:
        - id: url
          type: string
          label: Satellite URL
        - id: username
          type: string
          label: Username
        - id: password
          type: string
          label: Password
          secret: true
        - id: validate_certs
          type: boolean
          label: Validate certificates
      required: [url, username, password]
    injectors:
      env:
        FOREMAN_SERVER_URL: "{% raw %}{{ url }}{% endraw %}"
        FOREMAN_USERNAME: "{% raw %}{{ username }}{% endraw %}"
        FOREMAN_PASSWORD: "{% raw %}{{ password }}{% endraw %}"
        FOREMAN_VALIDATE_CERTS: "{% raw %}{{ validate_certs | default(false) }}{% endraw %}"

controller_credentials:
  - name: Gitea API
    organization: SOE Demo
    credential_type: Gitea API
    inputs:
      url: "{{ gitea_url }}"
      token: "{{ gitea_token }}"

  - name: Satellite API
    organization: SOE Demo
    credential_type: Satellite API
    inputs:
      url: "{{ satellite_url }}"
      username: admin
      password: "{{ satellite_password }}"
      validate_certs: false

  # Built-in type; injects K8S_AUTH_HOST / K8S_AUTH_API_KEY for kubernetes.core.
  - name: OpenShift API (demo namespace)
    organization: SOE Demo
    credential_type: OpenShift or Kubernetes API Bearer Token
    inputs:
      host: "{{ k8s_host }}"
      bearer_token: "{{ k8s_token }}"
      verify_ssl: false

controller_execution_environments:
  # ee-supported + rpm-build, built in the cluster (gitops/runner/Containerfile).
  - name: GitOps EE
    organization: SOE Demo
    image: "{{ gitops_ee_image }}"
    pull: always
    description: AAP ee-supported (redhat.satellite, kubernetes.core) + rpm-build

controller_projects:
  - name: RHEL Fleet (GitOps)
    organization: SOE Demo
    scm_type: git
    scm_url: "{{ gitea_repo_url }}"
    scm_branch: main
    scm_update_on_launch: true
    # Always sync now: a project created while the repo was still empty keeps
    # its failed update, and the job template then finds no playbook.
    update_project: true
    wait: true

controller_inventories:
  - name: Localhost only
    organization: SOE Demo
    description: The request playbook talks to APIs, it never logs in to a host
    # A non-empty JSON *string*: infra.aap_configuration 3.x pipes
    # `variables` through default(..., true) | regex_replace, which under
    # ansible-core 2.19+ turns the omit placeholder, {} and any mapping into a
    # string ansible.controller rejects. A JSON string passes through intact.
    variables: '{"demo": "gitops-self-service"}'

controller_hosts:
  - name: localhost
    inventory: Localhost only
    # JSON string for the same reason as the inventory above.
    variables: '{"ansible_connection": "local"}'

# --- Event-Driven Ansible: Gitea push -> event stream -> rulebook -> job template
# Extra vars: eda_webhook_secret (HMAC secret shared with the Gitea webhook),
# aap_url (gateway URL), aap_admin_password.
eda_credentials:
  - name: aap_controller
    organization: SOE Demo
    credential_type: Red Hat Ansible Automation Platform
    inputs:
      host: "{{ aap_url }}/api/controller/"
      username: admin
      password: "{{ aap_admin_password }}"
      verify_ssl: false
  # Gitea signs webhooks with X-Hub-Signature-256: "sha256=<hex HMAC>".
  - name: gitea_push_hmac
    organization: SOE Demo
    credential_type: HMAC Event Stream
    inputs:
      auth_type: hmac
      secret: "{{ eda_webhook_secret }}"
      hash_algorithm: sha256
      http_header_key: X-Hub-Signature-256
      signature_encoding: hex
      signature_prefix: "sha256="

eda_decision_environments:
  - name: de_supported
    organization: SOE Demo
    image_url: registry.redhat.io/ansible-automation-platform-27/de-supported-rhel9:latest

eda_projects:
  - name: rhel_fleet
    organization: SOE Demo
    url: "{{ gitea_repo_url }}"
    scm_branch: main

eda_event_streams:
  - name: gitea_push
    organization: SOE Demo
    credential_name: gitea_push_hmac
    forward_events: true

eda_rulebook_activations:
  - name: satellite_as_code
    description: Gitea push to main -> SAT · Apply Satellite as code
    organization: SOE Demo
    project: rhel_fleet
    rulebook: satellite-as-code.yml
    decision_environment: de_supported
    eda_credentials: [aap_controller]
    event_streams:
      - event_stream: gitea_push
        source_name: gitea
    restart_policy: always
    enabled: true

controller_templates:
  # Renamed to "GitOps · Request RHEL server".
  - name: Request RHEL server
    state: absent

  # Executor of Satellite as code: launched by the EDA rulebook after a push
  # to main that touches satellite/ (aap/rulebooks/satellite-as-code.yml), or
  # by hand. One run at a time: a second merge queues instead of being skipped.
  - name: SAT · Apply Satellite as code
    description: Applies satellite/structure.yml and satellite/releases.yml from Git to Satellite
    organization: SOE Demo
    project: RHEL Fleet (GitOps)
    inventory: Localhost only
    playbook: satellite/site.yml
    execution_environment: GitOps EE
    credentials:
      - Satellite API
      - OpenShift API (demo namespace)
    allow_simultaneous: false
    ask_variables_on_launch: true

  - name: GitOps · Request RHEL server
    description: Opens a pull request that adds a server to the fleet; optional auto-merge
    organization: SOE Demo
    project: RHEL Fleet (GitOps)
    inventory: Localhost only
    playbook: aap/create-server-pr.yml
    execution_environment: GitOps EE
    credentials:
      - Gitea API
    survey_enabled: true
    survey_spec:
      name: Request RHEL server
      description: A new RHEL 9 VM on OpenShift Virtualization, registered to Satellite
      spec:
        - question_name: Server name
          question_description: Lowercase letters, digits and '-', max 40
          variable: server_name
          type: text
          required: true
          min: 2
          max: 40
        - question_name: Lifecycle environment
          variable: lifecycle_env
          type: multiplechoice
          choices: [dev, qa, prod]
          default: dev
          required: true
        - question_name: Size
          question_description: small = 1 vCPU / 2 GiB, medium = 2 / 4, large = 4 / 8
          variable: server_size
          type: multiplechoice
          choices: [small, medium, large]
          default: small
          required: true
        - question_name: Merge without approval?
          question_description: "yes = demo shortcut; no = the PR waits for a reviewer"
          variable: auto_merge
          type: multiplechoice
          choices: ["yes", "no"]
          default: "no"
          required: true

  # --- AAP twins of the CLI steps (gitops/README.md, "Run sheet") ---
  - name: GitOps · Promote release
    description: Opens a PR that raises one environment in satellite/releases.yml (twin of release.sh promote)
    organization: SOE Demo
    project: RHEL Fleet (GitOps)
    inventory: Localhost only
    execution_environment: GitOps EE
    playbook: aap/promote-release.yml
    credentials:
    - Gitea API
    - Satellite API
    survey_enabled: true
    survey_spec:
      name: GitOps · Promote release
      description: Opens a PR that raises one environment in satellite/releases.yml (twin of release.sh promote)
      spec:
      - question_name: Lifecycle environment
        variable: lifecycle_env
        type: multiplechoice
        required: true
        default: dev
        choices:
        - dev
        - qa
        - prod
      - question_name: Version
        variable: version
        type: text
        required: false
        question_description: 'Empty = dev: newest published; qa: what Dev declares; prod: what QA declares'
        default: ''
      - &id001
        question_name: Merge without approval?
        variable: auto_merge
        type: multiplechoice
        required: true
        question_description: yes = demo shortcut; no = the PR waits for a reviewer
        default: 'no'
        choices:
        - 'yes'
        - 'no'
  - name: GitOps · Record Satellite state
    description: Opens a PR that writes what Satellite serves now into releases.yml (UI promotion, incremental update)
    organization: SOE Demo
    project: RHEL Fleet (GitOps)
    inventory: Localhost only
    execution_environment: GitOps EE
    playbook: aap/record-state.yml
    credentials:
    - Gitea API
    - Satellite API
    survey_enabled: true
    survey_spec:
      name: GitOps · Record Satellite state
      description: Opens a PR that writes what Satellite serves now into releases.yml (UI promotion, incremental update)
      spec:
      - *id001
  - name: GitOps · Roll back last release
    description: Opens a PR that reverts the last change of releases.yml (twin of release.sh rollback)
    organization: SOE Demo
    project: RHEL Fleet (GitOps)
    inventory: Localhost only
    execution_environment: GitOps EE
    playbook: aap/rollback-release.yml
    credentials:
    - Gitea API
    survey_enabled: true
    survey_spec:
      name: GitOps · Roll back last release
      description: Opens a PR that reverts the last change of releases.yml (twin of release.sh rollback)
      spec:
      - *id001
  - name: SAT · Publish new version
    description: Builds demo-app, uploads it, publishes Demo-App-CV + RHEL9-FullStack (twin of publish-version.sh)
    organization: SOE Demo
    project: RHEL Fleet (GitOps)
    inventory: Localhost only
    execution_environment: GitOps EE
    playbook: aap/publish-version.yml
    credentials:
    - Satellite API
    survey_enabled: true
    survey_spec:
      name: SAT · Publish new version
      description: Builds demo-app, uploads it, publishes Demo-App-CV + RHEL9-FullStack (twin of publish-version.sh)
      spec:
      - question_name: demo-app version
        variable: app_version
        type: text
        required: true
        question_description: Higher than installed, e.g. 5.0; an existing version is refused
  - name: SAT · Hotfix (incremental update)
    description: Copies one erratum into the version an environment serves (twin of hotfix.sh)
    organization: SOE Demo
    project: RHEL Fleet (GitOps)
    inventory: Localhost only
    execution_environment: GitOps EE
    playbook: aap/hotfix.yml
    credentials:
    - Satellite API
    survey_enabled: true
    survey_spec:
      name: SAT · Hotfix (incremental update)
      description: Copies one erratum into the version an environment serves (twin of hotfix.sh)
      spec:
      - question_name: Erratum
        variable: erratum_id
        type: text
        required: true
        question_description: e.g. DEMO-SA-2026:0002
        default: DEMO-SA-2026:0002
      - question_name: Lifecycle environment
        variable: lifecycle_env
        type: multiplechoice
        required: true
        default: prod
        choices:
        - dev
        - qa
        - prod
  - name: SAT · Status
    description: What Git declares vs what Satellite serves (twin of status.sh)
    organization: SOE Demo
    project: RHEL Fleet (GitOps)
    inventory: Localhost only
    execution_environment: GitOps EE
    playbook: aap/status.yml
    credentials:
    - Gitea API
    - Satellite API
  - name: HOST · Update package
    description: Updates a package (or installs one erratum) through Satellite remote execution
    organization: SOE Demo
    project: RHEL Fleet (GitOps)
    inventory: Localhost only
    execution_environment: GitOps EE
    playbook: aap/host-update.yml
    credentials:
    - Satellite API
    survey_enabled: true
    survey_spec:
      name: HOST · Update package
      description: Updates a package (or installs one erratum) through Satellite remote execution
      spec:
      - question_name: Hosts (Satellite search)
        variable: host_search
        type: text
        required: true
        question_description: e.g. name ~ lc-dev
        default: name ~ lc-dev
      - question_name: Package
        variable: package
        type: text
        required: true
        default: demo-app
      - question_name: Erratum (optional)
        variable: advisory
        type: text
        required: false
        question_description: Install exactly this erratum instead of the newest package
        default: ''
  - name: HOST · Undo last package transaction
    description: dnf history undo last through Satellite remote execution
    organization: SOE Demo
    project: RHEL Fleet (GitOps)
    inventory: Localhost only
    execution_environment: GitOps EE
    playbook: aap/host-undo.yml
    credentials:
    - Satellite API
    survey_enabled: true
    survey_spec:
      name: HOST · Undo last package transaction
      description: dnf history undo last through Satellite remote execution
      spec:
      - question_name: Hosts (Satellite search)
        variable: host_search
        type: text
        required: true
        question_description: e.g. name ~ lc-prod
        default: name ~ lc-prod
  - name: VM · Create server by hand (V1)
    description: Creates a VM directly on OpenShift, no pull request, not in Git (twin of manual-vm.sh)
    organization: SOE Demo
    project: RHEL Fleet (GitOps)
    inventory: Localhost only
    execution_environment: GitOps EE
    playbook: aap/create-vm-by-hand.yml
    credentials:
    - OpenShift API (demo namespace)
    survey_enabled: true
    survey_spec:
      name: VM · Create server by hand (V1)
      description: Creates a VM directly on OpenShift, no pull request, not in Git (twin of manual-vm.sh)
      spec:
      - question_name: Server name
        variable: server_name
        type: text
        required: true
        question_description: Lowercase letters, digits and -, max 40
        default: legacy-01
      - question_name: Lifecycle environment
        variable: lifecycle_env
        type: multiplechoice
        required: true
        default: dev
        choices:
        - dev
        - qa
        - prod
      - question_name: Size
        variable: server_size
        type: multiplechoice
        required: true
        question_description: small = 1 vCPU / 2 GiB
        default: small
        choices:
        - small
        - medium
        - large
