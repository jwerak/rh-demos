---
# AAP -> OpenShift access for the GitOps layer (applied by bootstrap.sh aapconfig).
#
# aap-demo: the identity AAP jobs use for the cluster (AAP credential
# "OpenShift API (demo namespace)"). Limited to this namespace: the
# registration Secret and the drift ConfigMap written by
# "SAT · Apply Satellite as code", and VirtualMachines for "VM · Create server
# by hand (V1)". Nothing cluster-wide.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aap-demo
  namespace: satellite-cloud-native
  labels:
    demo: satellite-cloud-native
---
apiVersion: v1
kind: Secret
metadata:
  name: aap-demo-token
  namespace: satellite-cloud-native
  labels:
    demo: satellite-cloud-native
  annotations:
    kubernetes.io/service-account.name: aap-demo
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aap-demo
  namespace: satellite-cloud-native
  labels:
    demo: satellite-cloud-native
rules:
  # Only the two objects the apply job writes. No list, no other Secrets:
  # the AAP-stored token must not read rhsm-credentials, the cloud-init
  # Secrets or satellite-cac-credentials. ("create" cannot be limited by name.)
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["satellite-registration"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["satellite-cac-applied"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["create"]
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines"]
    verbs: ["get", "list", "create", "patch", "update", "delete"]
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachineinstances"]
    verbs: ["get", "list"]
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datavolumes"]
    verbs: ["get", "list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aap-demo
  namespace: satellite-cloud-native
  labels:
    demo: satellite-cloud-native
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aap-demo
subjects:
  - kind: ServiceAccount
    name: aap-demo
    namespace: satellite-cloud-native
---
# AAP job pods run in the AAP namespace (bootstrap.sh substitutes AAP_NS for
# "aap" below) and pull the GitOps EE (ImageStream satellite-cac-runner) from
# this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aap-image-puller
  namespace: satellite-cloud-native
  labels:
    demo: satellite-cloud-native
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:serviceaccounts:aap
