---
# Run from AAP against lab-inventory.
# Attach APD Machine Credential (SSH) and AO Lab RHSM (env injection).
- name: Register lab nodes with Red Hat
  hosts: all
  gather_facts: true
  become: true
  vars:
    rhc_state: present
    rhc_organization: "{{ lookup('env', 'RHSM_ORG_ID') }}"
    rhc_auth:
      activation_keys:
        keys:
          - "{{ lookup('env', 'RHSM_ACTIVATION_KEY') }}"
    rhc_insights:
      state: present
      remediation: absent
      display_name: "{{ inventory_hostname }}"
      tags:
        group: "{{ ao_insights_group }}"
  pre_tasks:
    - name: Require the RHSM credential injected by AAP
      ansible.builtin.assert:
        that:
          - lookup('env', 'RHSM_ORG_ID') | length > 0
          - lookup('env', 'RHSM_ACTIVATION_KEY') | length > 0
        fail_msg: >-
          RHSM_ORG_ID and RHSM_ACTIVATION_KEY are empty. Attach the
          AO Lab RHSM credential to this job template.

    - name: Show the subscription release
      ansible.builtin.command: subscription-manager release --show
      register: ao_release_show
      changed_when: false
      failed_when: false

    - name: Clear the subscription release lock
      ansible.builtin.command: subscription-manager release --unset
      when: ao_release_show.stdout is search('Release:\s*[0-9]')
      changed_when: true

    - name: Require a deployment-specific Insights group
      ansible.builtin.assert:
        that:
          - ao_insights_group is defined
          - ao_insights_group | length > 0
          - ao_insights_group not in ['cve-lab', 'xfd48']
        fail_msg: >-
          ao_insights_group must be a name unique to this deployment.
          configure-aap.yml sets it on AO Lab | Register nodes.
          Shared names cve-lab and xfd48 are refused.

    - name: Remove the AWS RHUI client so subscription-manager can register
      ansible.builtin.dnf:
        name: rh-amazon-rhui-client*
        state: absent
  roles:
    - role: redhat.rhel_system_roles.rhc
  post_tasks:
    # `config --rhsm.manage_repos` without a value reads the setting on some
    # builds and errors with "expected one argument" on others. `--list` is
    # the form every build accepts.
    - name: Show whether subscription-manager manages repositories
      ansible.builtin.command: subscription-manager config --list
      register: ao_manage_repos_show
      changed_when: false

    - name: Enable repository management
      ansible.builtin.command: subscription-manager config --rhsm.manage_repos=1
      when: "'manage_repos = 1' not in ao_manage_repos_show.stdout"
      changed_when: true

    - name: List enabled repositories
      ansible.builtin.command: subscription-manager repos --list-enabled
      register: ao_enabled_repos
      changed_when: false

    - name: Enable BaseOS and AppStream
      ansible.builtin.command: subscription-manager repos --enable={{ item }}
      loop:
        - rhel-9-for-x86_64-baseos-rpms
        - rhel-9-for-x86_64-appstream-rpms
      when: item not in ao_enabled_repos.stdout
      changed_when: true

    - name: Report the Insights group for the AO trigger
      ansible.builtin.set_stats:
        data:
          insights_group: "{{ ao_insights_group }}"
          lab_tag: "group={{ ao_insights_group }}"
      run_once: true
